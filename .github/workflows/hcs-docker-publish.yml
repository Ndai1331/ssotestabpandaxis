# Build and push selected HCS Community images to Docker Hub on push to main.
# Images: longnguyen1331/hanhchinhso:<service-name>
#
# Required GitHub repository secrets:
#   DOCKERHUB_USERNAME  (e.g. longnguyen1331)
#   DOCKERHUB_TOKEN     (Docker Hub access token with Read & Write)

name: HCS Docker Publish

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/HCS_web_free_license/**'
      - '.github/workflows/hcs-docker-publish.yml'
  workflow_dispatch:
    inputs:
      service:
        description: Service image to build (use all for the complete release set)
        required: true
        type: choice
        default: all
        options:
          - all
          - db-migrator
          - auth-server
          - web-gateway
          - blazor
          - platform
          - organization
          - document
          - work-management
          - collaboration

env:
  HCS_ROOT: services/HCS_web_free_license
  DOCKER_REGISTRY: longnguyen1331/hanhchinhso

jobs:
  prepare:
    name: Select services to build
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.resolve.outputs.has_work }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve build selection
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SERVICE: ${{ inputs.service }}
          PUSH_COMMIT_MESSAGES_JSON: ${{ toJSON(github.event.commits.*.message) }}
        run: |
          set -eo pipefail

          all_matrix=$(cat <<'JSON' | jq -c .
          {
            "include": [
              {"service":"db-migrator","project":"src/HCS.DbMigrator/HCS.DbMigrator.csproj","app_dll":"HCS.DbMigrator.dll"},
              {"service":"auth-server","project":"apps/auth-server/HCS.AuthServer/HCS.AuthServer.csproj","app_dll":"HCS.AuthServer.dll","abp_libs":true,"abp_libs_path":"apps/auth-server/HCS.AuthServer"},
              {"service":"web-gateway","project":"gateways/web/HCS.WebGateway/HCS.WebGateway.csproj","app_dll":"HCS.WebGateway.dll"},
              {"service":"blazor","project":"src/HCS.Blazor/HCS.Blazor.csproj","app_dll":"HCS.Blazor.dll","publish_properties":"/p:BlazorEnableCompression=false","abp_libs":true,"abp_libs_path":"src/HCS.Blazor"},
              {"service":"platform","project":"services/platform/HCS.PlatformService/HCS.PlatformService.csproj","app_dll":"HCS.PlatformService.dll"},
              {"service":"organization","project":"services/organization/HCS.OrganizationService.Host/HCS.OrganizationService.Host.csproj","app_dll":"HCS.OrganizationService.Host.dll"},
              {"service":"document","project":"services/document/HCS.DocumentService/HCS.DocumentService.csproj","app_dll":"HCS.DocumentService.dll","install_libreoffice":true},
              {"service":"work-management","project":"services/work-management/HCS.WorkManagementService/HCS.WorkManagementService.csproj","app_dll":"HCS.WorkManagementService.dll"},
              {"service":"collaboration","project":"services/collaboration/HCS.CollaborationService/HCS.CollaborationService.csproj","app_dll":"HCS.CollaborationService.dll"}
            ]
          }
          JSON
          )

          selected_services=()
          select_all=false

          add_service() {
            for existing in "${selected_services[@]}"; do
              if [[ "$existing" == "$1" ]]; then
                return
              fi
            done
            selected_services+=("$1")
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "${DISPATCH_SERVICE:-}" in
              all)
                select_all=true
                ;;
              db-migrator|auth-server|web-gateway|blazor|platform|organization|document|work-management|collaboration)
                add_service "$DISPATCH_SERVICE"
                ;;
              *)
                echo "::error::Unsupported workflow_dispatch service: ${DISPATCH_SERVICE:-<empty>}"
                exit 1
                ;;
            esac
          else
            while IFS= read -r subject; do
              if [[ "$subject" =~ ^\[all\]([[:space:]]|$) ]]; then
                select_all=true
              elif [[ "$subject" =~ ^\[([a-z0-9-]+)\]([[:space:]]|$) ]]; then
                case "${BASH_REMATCH[1]}" in
                  db-migrator|auth-server|web-gateway|blazor|platform|organization|document|work-management|collaboration)
                    add_service "${BASH_REMATCH[1]}"
                    ;;
                esac
              fi
            done < <(
              jq -r 'if type == "array" then .[] | if type == "string" then split("\n")[0] else empty end else empty end' \
                <<< "${PUSH_COMMIT_MESSAGES_JSON:-null}"
            )
          fi

          if [[ "$select_all" == true ]]; then
            matrix="$all_matrix"
            has_work=true
            summary=all
          elif ((${#selected_services[@]} == 0)); then
            matrix='{"include":[{"service":"__none__","selected":false}]}'
            has_work=false
            summary=none
          else
            selected_json=$(printf '%s\n' "${selected_services[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
            matrix=$(jq -c --argjson selected "$selected_json" \
              '{include: [.include[] | select(.service as $service | $selected | index($service))]}' \
              <<< "$all_matrix")
            has_work=true
            summary=$(jq -r '[.include[].service] | join(",")' <<< "$matrix")
          fi

          echo "has_work=$has_work" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "::notice::Selected HCS build scope: $summary"

  build-push:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify HCS source tree
        working-directory: ${{ env.HCS_ROOT }}
        run: |
          for source_file in \
            src/HCS.Domain/Data/IHCSDbSchemaMigrator.cs \
            services/document/HCS.DocumentService/Data/DocumentServiceDbContext.cs \
            services/organization/HCS.OrganizationService/Data/OrganizationDbContext.cs \
            services/organization/HCS.OrganizationService.Host/Data/OrganizationDbContextFactory.cs \
            services/work-management/HCS.WorkManagementService/Data/WorkManagementDbContext.cs \
            services/collaboration/HCS.CollaborationService/Data/CollaborationDbContext.cs
          do
            if [[ ! -f "$source_file" ]]; then
              echo "::error file=$source_file::Required HCS source file is missing from the checkout"
              exit 1
            fi
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Node.js (ABP libs)
        if: matrix.abp_libs
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ABP static assets
        if: matrix.abp_libs
        working-directory: ${{ env.HCS_ROOT }}/${{ matrix.abp_libs_path }}
        run: |
          dotnet tool install --global Volo.Abp.Studio.Cli --version 3.0.8
          export PATH="$HOME/.dotnet/tools:$PATH"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          YARN_IGNORE_ENGINES=1 yarn install --frozen-lockfile
          YARN_IGNORE_ENGINES=1 abp install-libs

      - name: Verify ABP static assets
        if: matrix.abp_libs
        working-directory: ${{ env.HCS_ROOT }}/${{ matrix.abp_libs_path }}
        run: |
          if [[ ! -d wwwroot/libs ]] || ! find wwwroot/libs -type f -print -quit | grep -q .; then
            echo "::error::ABP static assets were not generated under wwwroot/libs"
            exit 1
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.HCS_ROOT }}
          file: ${{ env.HCS_ROOT }}/deploy/docker/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}:${{ matrix.service }}
          build-args: |
            PROJECT=${{ matrix.project }}
            APP_DLL=${{ matrix.app_dll }}
            PUBLISH_PROPERTIES=${{ matrix.publish_properties || '' }}
            INSTALL_LIBREOFFICE=${{ matrix.install_libreoffice || 'false' }}
          cache-from: type=gha,scope=hcs-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=hcs-${{ matrix.service }}
