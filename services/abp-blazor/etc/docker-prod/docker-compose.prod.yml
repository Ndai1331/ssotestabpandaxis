# Production skeleton — ABP hanhchinhso (Docker Compose + host Nginx)
#
# Usage:
#   cp .env.example .env && chmod 600 .env   # fill secrets + public URLs
#   mkdir -p certs data && place openiddict.pfx in certs/
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#   docker compose -f docker-compose.prod.yml --env-file .env --profile full up -d
#
# Public surface (bound to loopback for host Nginx):
#   127.0.0.1:8080 → blazor
#   127.0.0.1:8081 → authserver
#   127.0.0.1:8082 → webgateway
#
# See README.md and docs/runbooks/deploy-abp-production.md

name: hcs-prod

x-restart: &restart
  restart: unless-stopped

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:80
  DOTNET_ENVIRONMENT: Production

x-redis-rabbit: &redis-rabbit
  Redis__Configuration: ${REDIS_CONFIGURATION}
  RabbitMQ__Connections__Default__HostName: rabbitmq
  RabbitMQ__Connections__Default__UserName: ${RABBITMQ_USER}
  RabbitMQ__Connections__Default__Password: ${RABBITMQ_PASSWORD}

x-observability: &observability
  ElasticSearch__IsLoggingEnabled: ${ELASTICSEARCH_LOGGING_ENABLED:-false}
  App__EnablePII: ${ENABLE_PII:-false}
  StringEncryption__DefaultPassPhrase: ${STRING_ENCRYPTION_PASSPHRASE}
  AbpStudioClient__IsLinkEnabled: "false"

services:
  # -------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks: [hcs_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7.2.2-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./data/redis:/data
    networks: [hcs_internal]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    <<: *restart
    image: rabbitmq:3.12.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks: [hcs_internal]
    # Management UI: do NOT publish 15672 to public interfaces
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  # -------------------------------------------------------------------------
  # Core apps (always on)
  # -------------------------------------------------------------------------
  authserver:
    <<: *restart
    image: ${IMAGE_REGISTRY}/authserver:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__IdentityService: ${CS_IDENTITY}
      ConnectionStrings__AdministrationService: ${CS_ADMINISTRATION}
      ConnectionStrings__AbpBlobStoring: ${CS_BLOB}
      ConnectionStrings__AuditLoggingService: ${CS_AUDIT}
      ConnectionStrings__LanguageService: ${CS_LANGUAGE}
      App__SelfUrl: ${PUBLIC_AUTH_URL}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL},${PUBLIC_APP_URL},${PUBLIC_STUDIO_URL}
      App__RedirectAllowedUrls: ${PUBLIC_APP_URL},${PUBLIC_STUDIO_URL}
      App__HealthCheckUrl: /health-status
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      AuthServer__CertificatePassPhrase: ${AUTHSERVER_CERTIFICATE_PASSPHRASE}
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY:-}
      Keycloak__ClientId: ${KEYCLOAK_CLIENT_ID:-}
      Keycloak__ClientSecret: ${KEYCLOAK_CLIENT_SECRET:-}
      Keycloak__CallbackPath: ${KEYCLOAK_CALLBACK_PATH:-/signin-oidc}
      RabbitMQ__EventBus__ClientName: hanhchinhso_AuthServer
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    volumes:
      - ./certs/openiddict.pfx:/app/openiddict.pfx:ro
    ports:
      - "127.0.0.1:8081:80"
    networks: [hcs_internal]

  identity:
    <<: *restart
    image: ${IMAGE_REGISTRY}/identity:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__IdentityService: ${CS_IDENTITY}
      ConnectionStrings__AdministrationService: ${CS_ADMINISTRATION}
      ConnectionStrings__AbpBlobStoring: ${CS_BLOB}
      ConnectionStrings__AuditLoggingService: ${CS_AUDIT}
      ConnectionStrings__LanguageService: ${CS_LANGUAGE}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_Identity
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    networks: [hcs_internal]

  administration:
    <<: *restart
    image: ${IMAGE_REGISTRY}/administration:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__AdministrationService: ${CS_ADMINISTRATION}
      ConnectionStrings__AbpBlobStoring: ${CS_BLOB}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_Administration
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    networks: [hcs_internal]

  language:
    <<: *restart
    image: ${IMAGE_REGISTRY}/language:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__LanguageService: ${CS_LANGUAGE}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_Language
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    networks: [hcs_internal]

  webgateway:
    <<: *restart
    image: ${IMAGE_REGISTRY}/webgateway:${IMAGE_TAG}
    depends_on:
      - authserver
      - identity
      - administration
      - language
    environment:
      <<: [*dotnet-env, *observability]
      App__CorsOrigins: ${PUBLIC_APP_URL}
      App__HealthCheckUrl: /health-status
      Swagger__IsEnabled: ${SWAGGER_ENABLED:-false}
      ReverseProxy__Clusters__AuthServer__Destinations__AuthServer__Address: http://authserver/
      ReverseProxy__Clusters__Administration__Destinations__Administration__Address: http://administration/
      ReverseProxy__Clusters__Identity__Destinations__Identity__Address: http://identity/
      ReverseProxy__Clusters__Language__Destinations__Language__Address: http://language/
      ReverseProxy__Clusters__AuditLogging__Destinations__AuditLogging__Address: http://auditlogging/
      ReverseProxy__Clusters__Gdpr__Destinations__Gdpr__Address: http://gdpr/
      ReverseProxy__Clusters__AIManagement__Destinations__AIManagement__Address: http://aimanagement/
      ReverseProxy__Clusters__Organization__Destinations__Organization__Address: http://organization/
    ports:
      - "127.0.0.1:8082:80"
    networks: [hcs_internal]

  blazor:
    <<: *restart
    image: ${IMAGE_REGISTRY}/blazorwebapp:${IMAGE_TAG}
    depends_on:
      - webgateway
      - authserver
    environment:
      <<: *dotnet-env
      App__SelfUrl: ${PUBLIC_APP_URL}
      App__DisablePII: "true"
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      RemoteServices__Default__BaseUrl: ${PUBLIC_GATEWAY_URL}/
      RemoteServices__AbpAccountPublic__BaseUrl: ${PUBLIC_AUTH_URL}/
    ports:
      - "127.0.0.1:8080:80"
    networks: [hcs_internal]

  # -------------------------------------------------------------------------
  # Full profile — Organization / Workflow / Audit / GDPR / AI / MinIO
  #   docker compose --profile full up -d
  # -------------------------------------------------------------------------
  organization:
    <<: *restart
    profiles: [full]
    image: ${IMAGE_REGISTRY}/organization:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__OrganizationService: ${CS_ORGANIZATION}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_Organization
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    networks: [hcs_internal]

  workflow:
    <<: *restart
    profiles: [full]
    image: ${IMAGE_REGISTRY}/workflow:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__WorkflowService: ${CS_WORKFLOW}
      ConnectionStrings__AdministrationService: ${CS_ADMINISTRATION}
      ConnectionStrings__AuditLoggingService: ${CS_AUDIT}
      ConnectionStrings__AbpBlobStoring: ${CS_BLOB}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL},${PUBLIC_STUDIO_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_Workflow
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    # Elsa Studio calls Workflow API directly (not via gateway)
    ports:
      - "127.0.0.1:8085:80"
    networks: [hcs_internal]

  auditlogging:
    <<: *restart
    profiles: [full]
    image: ${IMAGE_REGISTRY}/auditlogging:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__AuditLoggingService: ${CS_AUDIT}
      ConnectionStrings__AdministrationService: ${CS_ADMINISTRATION}
      ConnectionStrings__LanguageService: ${CS_LANGUAGE}
      ConnectionStrings__AbpBlobStoring: ${CS_BLOB}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_AuditLogging
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    networks: [hcs_internal]

  gdpr:
    <<: *restart
    profiles: [full]
    image: ${IMAGE_REGISTRY}/gdpr:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__GdprService: ${CS_GDPR}
      ConnectionStrings__AdministrationService: ${CS_ADMINISTRATION}
      ConnectionStrings__AuditLoggingService: ${CS_AUDIT}
      ConnectionStrings__LanguageService: ${CS_LANGUAGE}
      ConnectionStrings__AbpBlobStoring: ${CS_BLOB}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_Gdpr
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    networks: [hcs_internal]

  aimanagement:
    <<: *restart
    profiles: [full]
    image: ${IMAGE_REGISTRY}/aimanagement:${IMAGE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [*dotnet-env, *redis-rabbit, *observability]
      ConnectionStrings__AIManagementService: ${CS_AIMANAGEMENT}
      ConnectionStrings__AdministrationService: ${CS_ADMINISTRATION}
      ConnectionStrings__AuditLoggingService: ${CS_AUDIT}
      ConnectionStrings__LanguageService: ${CS_LANGUAGE}
      ConnectionStrings__AbpBlobStoring: ${CS_BLOB}
      AuthServer__Authority: ${PUBLIC_AUTH_URL}
      AuthServer__RequireHttpsMetadata: ${AUTHSERVER_REQUIRE_HTTPS_METADATA:-true}
      App__CorsOrigins: ${PUBLIC_GATEWAY_URL}
      App__HealthCheckUrl: /health-status
      RabbitMQ__EventBus__ClientName: hanhchinhso_AIManagement
      RabbitMQ__EventBus__ExchangeName: hanhchinhso
    networks: [hcs_internal]

  minio:
    <<: *restart
    profiles: [full]
    # Pin in your registry mirror; digest from local lab compose as reference
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    networks: [hcs_internal]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  hcs_internal:
    driver: bridge
