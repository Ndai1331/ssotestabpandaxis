volumes:
  hanhchinhso_pgvector_data:
networks:
  hanhchinhso:
    external: true

services:
  pgvector:
    container_name: hanhchinhso-pgvector
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    volumes:
      - hanhchinhso_pgvector_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_management
    networks:
      - hanhchinhso
    restart: unless-stopped
