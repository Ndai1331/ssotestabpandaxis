volumes:
  abptestwithsso_pgvector_data:
networks:
  abptestwithsso:
    external: true

services:
  pgvector:
    container_name: abptestwithsso-pgvector
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    volumes:
      - abptestwithsso_pgvector_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_management
    networks:
      - abptestwithsso
    restart: unless-stopped
