volumes:
  abptestwithsso_rabbitmq:
networks:
  abptestwithsso:
    external: true

services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3.12.7-management-alpine
    volumes:
      - abptestwithsso_rabbitmq:/var/lib/rabbitmq
    networks:
      - abptestwithsso
    ports:
      - "15672:15672"
      - "5672:5672"
