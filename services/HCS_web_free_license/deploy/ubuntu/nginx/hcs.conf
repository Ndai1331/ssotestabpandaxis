# HCS public vhosts — copy to /etc/nginx/sites-available/hcs.conf
# then: ln -s /etc/nginx/sites-available/hcs.conf /etc/nginx/sites-enabled/hcs.conf
#
# Replace the three server_name values and the Let's Encrypt live directory
# if DNS is not hcs.binhduong.vn / auth.hcs.binhduong.vn / sso.binhduong.vn.
#
# Loopback upstreams (docker-compose.apps.yml):
#   127.0.0.1:8081  Blazor
#   127.0.0.1:8082  Web Gateway / BFF
#   127.0.0.1:8083  AuthServer
#   127.0.0.1:8084  Keycloak

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream hcs_blazor {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream hcs_gateway {
    server 127.0.0.1:8082;
    keepalive 32;
}

upstream hcs_auth {
    server 127.0.0.1:8083;
    keepalive 32;
}

upstream hcs_keycloak {
    server 127.0.0.1:8084;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name hcs.binhduong.vn auth.hcs.binhduong.vn sso.binhduong.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hcs.binhduong.vn;

    ssl_certificate     /etc/letsencrypt/live/hcs.binhduong.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hcs.binhduong.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    large_client_header_buffers 8 32k;

    location = /Account/Login {
        return 302 /login;
    }

    location /Account/ {
        return 302 https://auth.hcs.binhduong.vn$request_uri;
    }

    location /bff/ {
        proxy_pass http://hcs_gateway;
        include /etc/nginx/hcs-proxy.inc;
    }

    location = /signin-oidc {
        proxy_pass http://hcs_gateway;
        include /etc/nginx/hcs-proxy.inc;
    }

    location = /signout-callback-oidc {
        proxy_pass http://hcs_gateway;
        include /etc/nginx/hcs-proxy.inc;
    }

    location /api/ {
        proxy_pass http://hcs_gateway;
        include /etc/nginx/hcs-proxy.inc;
    }

    location /hubs/ {
        proxy_pass http://hcs_gateway;
        include /etc/nginx/hcs-proxy.inc;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://hcs_blazor;
        include /etc/nginx/hcs-proxy.inc;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auth.hcs.binhduong.vn;

    ssl_certificate     /etc/letsencrypt/live/hcs.binhduong.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hcs.binhduong.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    large_client_header_buffers 8 32k;

    location = / {
        return 302 https://hcs.binhduong.vn/;
    }

    location / {
        proxy_pass http://hcs_auth;
        include /etc/nginx/hcs-proxy.inc;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sso.binhduong.vn;

    ssl_certificate     /etc/letsencrypt/live/hcs.binhduong.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hcs.binhduong.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    large_client_header_buffers 8 32k;

    location / {
        proxy_pass http://hcs_keycloak;
        include /etc/nginx/hcs-proxy.inc;
        proxy_buffering off;
    }
}
