<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — HCS Hành chính số</title>
  <meta name="description" content="Đăng nhập hệ thống Hành chính số HCS của HTL.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <a class="skip-link" href="#login-form">Bỏ qua tới biểu mẫu đăng nhập</a>

  <div class="login-brand">
    <div class="htl-mark">HTL</div>
    <div class="htl-sub">TECH DEV &amp; INVEST</div>
  </div>

  <main class="login-card">
    <header class="login-head">
      <img src="assets/logo-hcs.svg" width="48" height="48" alt="">
      <div>
        <h1>HCS - Hành chính số</h1>
        <p data-i18n="account">Tài khoản HCS</p>
      </div>
    </header>

    <div class="lang-row">
      <label class="field-label" for="language" data-i18n="chooseLang">Chọn ngôn ngữ</label>
      <div class="lang-select-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M4 5h9M8.5 5v14M4 19h9"/>
          <path d="M14 8h6l-6 8h6"/>
        </svg>
        <select id="language" class="lang-select" data-lang name="language" aria-label="Ngôn ngữ">
          <option value="vi" selected>Tiếng Việt</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>

    <form id="login-form" class="login-form" action="home.html" method="get" novalidate>
      <div class="field">
        <label class="field-label" for="username" data-i18n="username">Tên đăng nhập hoặc địa chỉ email</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username" required>
        <p class="field-error" id="username-error" role="alert"></p>
      </div>

      <div class="field">
        <label class="field-label" for="password" data-i18n="password">Mật khẩu</label>
        <div class="input-wrap">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="input-action" type="button" data-toggle-password data-i18n-aria="showPassword" aria-label="Hiện mật khẩu" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="field-error" id="password-error" role="alert"></p>
      </div>

      <label class="checkbox">
        <input type="checkbox" name="remember" value="1">
        <span data-i18n="remember">Ghi nhớ</span>
      </label>

      <button class="btn btn-primary btn-block" type="submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/></svg>
        <span data-i18n="login">Đăng nhập</span>
      </button>
    </form>

    <p class="divider-label" data-i18n="orLogin">Hoặc đăng nhập bằng:</p>
    <button class="btn btn-outline btn-block" id="sso-btn" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 5 6v6c0 5 3.4 8.4 7 9.5C15.6 20.4 19 17 19 12V6z"/></svg>
      <span data-i18n="sso">Login với SSO</span>
    </button>
  </main>

  <div class="sso-overlay" id="sso-overlay" role="dialog" aria-modal="true" aria-labelledby="sso-title">
    <div class="sso-panel">
      <span class="spinner" aria-hidden="true"></span>
      <h2 id="sso-title" data-i18n="ssoTitle">Đăng nhập SSO</h2>
      <p data-i18n="ssoBody">Đang chuyển hướng tới nhà cung cấp xác thực...</p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
