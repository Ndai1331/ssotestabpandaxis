<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="dnsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="toolsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="100%" style="stop-color:#e11d48"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="shadowSm">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="920" fill="url(#bgGrad)" rx="12"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.5"/>
  </pattern>
  <rect width="1200" height="920" fill="url(#grid)"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700" letter-spacing="1">
    TASK9 INFRASTRUCTURE TOPOLOGY
  </text>
  <text x="600" y="62" text-anchor="middle" fill="#64748b" font-size="12">
    4 Servers · 23 Subdomains · DigitalOcean · Updated 2026-05-01
  </text>

  <!-- ============ INTERNET / DNS ============ -->
  <g filter="url(#shadow)">
    <rect x="430" y="80" width="340" height="52" rx="26" fill="url(#dnsGrad)" opacity="0.95"/>
    <text x="600" y="100" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">☁ INTERNET</text>
    <text x="600" y="118" text-anchor="middle" fill="#451a03" font-size="13" font-weight="700">DNS — task9.pro</text>
  </g>

  <!-- Connection lines from DNS to servers -->
  <line x1="500" y1="132" x2="190" y2="185" stroke="#f59e0b" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="550" y1="132" x2="490" y2="185" stroke="#f59e0b" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="650" y1="132" x2="780" y2="185" stroke="#f59e0b" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>
  <line x1="700" y1="132" x2="1050" y2="185" stroke="#f59e0b" stroke-width="2" opacity="0.4" stroke-dasharray="6,4"/>

  <!-- ============ SERVER 1 — MAIN ============ -->
  <g filter="url(#shadow)">
    <!-- Server box -->
    <rect x="30" y="185" width="320" height="540" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" opacity="0.95"/>
    <!-- Header -->
    <rect x="30" y="185" width="320" height="56" rx="12" fill="url(#mainGrad)"/>
    <rect x="30" y="215" width="320" height="26" fill="url(#mainGrad)"/>
    <text x="52" y="208" fill="#fff" font-size="10" font-weight="600" opacity="0.8">SERVER 1</text>
    <text x="52" y="226" fill="#fff" font-size="15" font-weight="700">🖥 Main Production</text>
    <text x="310" y="226" fill="#bfdbfe" font-size="10" text-anchor="end" font-weight="500">206.189.147.187</text>

    <!-- Subdomain entries -->
    <g fill="#e2e8f0" font-size="11.5">
      <!-- Core -->
      <text x="52" y="264" fill="#60a5fa" font-size="9" font-weight="600" letter-spacing="1">CORE PLATFORM</text>
      <circle cx="52" cy="283" r="3" fill="#3b82f6"/>
      <text x="62" y="287">task9.pro</text>
      <text x="250" y="287" fill="#94a3b8" font-size="10">UI Blazor</text>

      <circle cx="52" cy="305" r="3" fill="#3b82f6"/>
      <text x="62" y="309">api.task9.pro</text>
      <text x="250" y="309" fill="#94a3b8" font-size="10">API .NET</text>

      <circle cx="52" cy="327" r="3" fill="#3b82f6"/>
      <text x="62" y="331">workflow.task9.pro</text>
      <text x="250" y="331" fill="#94a3b8" font-size="10">N8N</text>

      <!-- Data -->
      <text x="52" y="360" fill="#60a5fa" font-size="9" font-weight="600" letter-spacing="1">DATA &amp; STORAGE</text>
      <circle cx="52" cy="379" r="3" fill="#60a5fa"/>
      <text x="62" y="383">dashboard.task9.pro</text>
      <text x="250" y="383" fill="#94a3b8" font-size="10">Metabase</text>

      <circle cx="52" cy="401" r="3" fill="#60a5fa"/>
      <text x="62" y="405">data-warehouse.task9.pro</text>
      <text x="250" y="405" fill="#94a3b8" font-size="10">ETL/DW</text>

      <circle cx="52" cy="423" r="3" fill="#60a5fa"/>
      <text x="62" y="427">minio.task9.pro</text>
      <text x="250" y="427" fill="#94a3b8" font-size="10">S3 API</text>

      <circle cx="52" cy="445" r="3" fill="#60a5fa"/>
      <text x="62" y="449">minio-ui.task9.pro</text>
      <text x="250" y="449" fill="#94a3b8" font-size="10">S3 Console</text>

      <!-- Tools -->
      <text x="52" y="478" fill="#60a5fa" font-size="9" font-weight="600" letter-spacing="1">MONITORING &amp; TOOLS</text>
      <circle cx="52" cy="497" r="3" fill="#93c5fd"/>
      <text x="62" y="501">mcp-seo.task9.pro</text>
      <text x="250" y="501" fill="#94a3b8" font-size="10">MCP SEO</text>

      <circle cx="52" cy="519" r="3" fill="#93c5fd"/>
      <text x="62" y="523">status.task9.pro</text>
      <text x="250" y="523" fill="#94a3b8" font-size="10">Uptime</text>

      <!-- Staging -->
      <text x="52" y="556" fill="#60a5fa" font-size="9" font-weight="600" letter-spacing="1">STAGING / TEST</text>
      <circle cx="52" cy="575" r="3" fill="#93c5fd" opacity="0.6"/>
      <text x="62" y="579" opacity="0.7">api-test.task9.pro</text>
      <text x="250" y="579" fill="#94a3b8" font-size="10" opacity="0.6">API Test</text>

      <circle cx="52" cy="597" r="3" fill="#93c5fd" opacity="0.6"/>
      <text x="62" y="601" opacity="0.7">ui-test.task9.pro</text>
      <text x="250" y="601" fill="#94a3b8" font-size="10" opacity="0.6">UI Test</text>
    </g>

    <!-- Count badge -->
    <rect x="282" y="192" width="56" height="22" rx="11" fill="#1e3a8a" opacity="0.7"/>
    <text x="310" y="207" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">11 subs</text>
  </g>

  <!-- ============ SERVER 2 — TOOLS ============ -->
  <g filter="url(#shadow)">
    <rect x="370" y="185" width="260" height="440" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
    <!-- Header -->
    <rect x="370" y="185" width="260" height="56" rx="12" fill="url(#toolsGrad)"/>
    <rect x="370" y="215" width="260" height="26" fill="url(#toolsGrad)"/>
    <text x="392" y="208" fill="#fff" font-size="10" font-weight="600" opacity="0.8">SERVER 2</text>
    <text x="392" y="226" fill="#fff" font-size="15" font-weight="700">🔧 Tools &amp; Utilities</text>
    <text x="590" y="226" fill="#d1fae5" font-size="10" text-anchor="end" font-weight="500">165.232.163.16</text>

    <g fill="#e2e8f0" font-size="11.5">
      <!-- SEO -->
      <text x="392" y="264" fill="#34d399" font-size="9" font-weight="600" letter-spacing="1">SEO TOOLS</text>
      <circle cx="392" cy="283" r="3" fill="#10b981"/>
      <text x="402" y="287">ahref-api.task9.pro</text>
      <text x="585" y="287" fill="#94a3b8" font-size="10" text-anchor="end">Ahrefs API</text>

      <circle cx="392" cy="305" r="3" fill="#10b981"/>
      <text x="402" y="309">ahref-mcp.task9.pro</text>
      <text x="585" y="309" fill="#94a3b8" font-size="10" text-anchor="end">Ahrefs MCP</text>

      <!-- Infra -->
      <text x="392" y="342" fill="#34d399" font-size="9" font-weight="600" letter-spacing="1">INFRASTRUCTURE</text>
      <circle cx="392" cy="361" r="3" fill="#6ee7b7"/>
      <text x="402" y="365">cicd.task9.pro</text>
      <text x="585" y="365" fill="#94a3b8" font-size="10" text-anchor="end">CI/CD Runner</text>

      <circle cx="392" cy="383" r="3" fill="#6ee7b7"/>
      <text x="402" y="387">proxy.task9.pro</text>
      <text x="585" y="387" fill="#94a3b8" font-size="10" text-anchor="end">Proxy Svc</text>

      <!-- QC -->
      <text x="392" y="420" fill="#34d399" font-size="9" font-weight="600" letter-spacing="1">QC &amp; ANALYSIS</text>
      <circle cx="392" cy="439" r="3" fill="#a7f3d0"/>
      <text x="402" y="443">geoblock.task9.pro</text>
      <text x="585" y="443" fill="#94a3b8" font-size="10" text-anchor="end">GeoBlock</text>

      <circle cx="392" cy="461" r="3" fill="#a7f3d0"/>
      <text x="402" y="465">qcinspect.task9.pro</text>
      <text x="585" y="465" fill="#94a3b8" font-size="10" text-anchor="end">QC Inspect</text>

      <circle cx="392" cy="483" r="3" fill="#a7f3d0"/>
      <text x="402" y="487">subsytem.task9.pro</text>
      <text x="585" y="487" fill="#94a3b8" font-size="10" text-anchor="end">Sub-system</text>
    </g>

    <!-- Count badge -->
    <rect x="568" y="192" width="50" height="22" rx="11" fill="#064e3b" opacity="0.7"/>
    <text x="593" y="207" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">7 subs</text>
  </g>

  <!-- ============ SERVER 3 — AI & WORKERS ============ -->
  <g filter="url(#shadow)">
    <rect x="650" y="185" width="260" height="340" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
    <!-- Header -->
    <rect x="650" y="185" width="260" height="56" rx="12" fill="url(#aiGrad)"/>
    <rect x="650" y="215" width="260" height="26" fill="url(#aiGrad)"/>
    <text x="672" y="208" fill="#fff" font-size="10" font-weight="600" opacity="0.8">SERVER 3</text>
    <text x="672" y="226" fill="#fff" font-size="15" font-weight="700">🤖 AI &amp; Workers</text>
    <text x="870" y="226" fill="#e9d5ff" font-size="10" text-anchor="end" font-weight="500">167.71.200.122</text>

    <g fill="#e2e8f0" font-size="11.5">
      <text x="672" y="264" fill="#a78bfa" font-size="9" font-weight="600" letter-spacing="1">AI SERVICES</text>
      <circle cx="672" cy="283" r="3" fill="#8b5cf6"/>
      <text x="682" y="287">agent.task9.pro</text>
      <text x="868" y="287" fill="#94a3b8" font-size="10" text-anchor="end">AI Sidecar</text>

      <text x="672" y="320" fill="#a78bfa" font-size="9" font-weight="600" letter-spacing="1">WORKERS</text>
      <circle cx="672" cy="339" r="3" fill="#c4b5fd"/>
      <text x="682" y="343">cpd.task9.pro</text>
      <text x="868" y="343" fill="#94a3b8" font-size="10" text-anchor="end">CPD Worker</text>

      <circle cx="672" cy="361" r="3" fill="#c4b5fd"/>
      <text x="682" y="365">wl.task9.pro</text>
      <text x="868" y="365" fill="#94a3b8" font-size="10" text-anchor="end">Worker-Lite</text>

      <circle cx="672" cy="383" r="3" fill="#c4b5fd"/>
      <text x="682" y="387">workers.task9.pro</text>
      <text x="868" y="387" fill="#94a3b8" font-size="10" text-anchor="end">Worker Pool</text>
    </g>

    <!-- Count badge -->
    <rect x="848" y="192" width="50" height="22" rx="11" fill="#3b0764" opacity="0.7"/>
    <text x="873" y="207" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">4 subs</text>
  </g>

  <!-- ============ SERVER 4 — LLM ============ -->
  <g filter="url(#shadow)">
    <rect x="930" y="185" width="240" height="240" rx="12" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" opacity="0.95"/>
    <!-- Header -->
    <rect x="930" y="185" width="240" height="56" rx="12" fill="url(#llmGrad)"/>
    <rect x="930" y="215" width="240" height="26" fill="url(#llmGrad)"/>
    <text x="952" y="208" fill="#fff" font-size="10" font-weight="600" opacity="0.8">SERVER 4</text>
    <text x="952" y="226" fill="#fff" font-size="15" font-weight="700">🧠 LLM Inference</text>
    <text x="1130" y="226" fill="#fecdd3" font-size="10" text-anchor="end" font-weight="500">152.42.250.136</text>

    <g fill="#e2e8f0" font-size="11.5">
      <text x="952" y="264" fill="#fb7185" font-size="9" font-weight="600" letter-spacing="1">INFERENCE</text>
      <circle cx="952" cy="283" r="3" fill="#f43f5e"/>
      <text x="962" y="287">llm.task9.pro</text>
      <text x="1130" y="287" fill="#94a3b8" font-size="10" text-anchor="end">Ollama</text>
    </g>

    <!-- Ollama icon area -->
    <rect x="980" y="320" width="140" height="70" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="0.5" opacity="0.5"/>
    <text x="1050" y="350" text-anchor="middle" fill="#64748b" font-size="10">Dedicated GPU</text>
    <text x="1050" y="370" text-anchor="middle" fill="#64748b" font-size="10">LLM Models</text>

    <!-- Count badge -->
    <rect x="1112" y="192" width="46" height="22" rx="11" fill="#4c0519" opacity="0.7"/>
    <text x="1135" y="207" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="600">1 sub</text>
  </g>

  <!-- ============ INTER-SERVER CONNECTIONS ============ -->
  <!-- Main ↔ Tools -->
  <line x1="350" y1="400" x2="370" y2="400" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Main ↔ AI -->
  <path d="M 350 500 Q 500 620 650 380" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- AI → LLM -->
  <line x1="910" y1="340" x2="930" y2="340" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="920" y="334" fill="#64748b" font-size="8" text-anchor="middle">inference</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(30, 750)">
    <rect width="1140" height="140" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9"/>
    <text x="20" y="28" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">LEGEND</text>

    <!-- Server colors -->
    <rect x="20" y="42" width="12" height="12" rx="3" fill="url(#mainGrad)"/>
    <text x="40" y="53" fill="#e2e8f0" font-size="11">Main Production — Core platform, APIs, storage, monitoring</text>

    <rect x="20" y="62" width="12" height="12" rx="3" fill="url(#toolsGrad)"/>
    <text x="40" y="73" fill="#e2e8f0" font-size="11">Tools &amp; Utilities — SEO tools, CI/CD, proxy, QC inspection</text>

    <rect x="20" y="82" width="12" height="12" rx="3" fill="url(#aiGrad)"/>
    <text x="40" y="93" fill="#e2e8f0" font-size="11">AI &amp; Workers — Claude sidecar, CPD automation, background jobs</text>

    <rect x="20" y="102" width="12" height="12" rx="3" fill="url(#llmGrad)"/>
    <text x="40" y="113" fill="#e2e8f0" font-size="11">LLM Inference — Dedicated Ollama server for local model inference</text>

    <!-- Tech stack -->
    <text x="620" y="48" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">TECH STACK</text>
    <text x="620" y="68" fill="#64748b" font-size="10.5">▸ Nginx Reverse Proxy + Let's Encrypt SSL</text>
    <text x="620" y="85" fill="#64748b" font-size="10.5">▸ Docker containers on all servers</text>
    <text x="620" y="102" fill="#64748b" font-size="10.5">▸ .NET 9 (API/UI) · Node.js (Agent) · Python (Workers)</text>
    <text x="620" y="119" fill="#64748b" font-size="10.5">▸ MySQL 8 · Redis 7 · Minio S3 · Ollama</text>
  </g>

  <!-- Footer -->
  <text x="600" y="908" text-anchor="middle" fill="#475569" font-size="10">
    task9org/task9-workspace · docs/infrastructure-topology.svg
  </text>
</svg>
